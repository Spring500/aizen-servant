## A 线：agent 骨架

| 步 | 交付 | 验证 |
|----|------|------|
| **A0** 现状对齐 | 升级 workspace 三包（ADR-005）；包名归 `@aizen/*`；文档与代码一致 | 三包可独立 install |
| **A1** Pi 接入 | 装 Pi SDK，跑通最小 session+prompt+`agent_end`；`mock-pi` 工厂 | 一个 integration 测试用 `inMemory()` 完成单轮 |
| **A2** 单 session 引擎 | AgentEngine + 队列 + SessionStrategy 接口 + `SingleSessionStrategy` | 多消息入队按 ADR-008 循环；切策略仅改配置 |
| **A3** HTTP 渠道 | `channels/http` REST 入站（盖认证身份）+ `http_send` | **验收 1**：发消息→经 send tool 回复 |
| **A4** 记忆检索接入 | retrieval 编排：构造 ExploreFn（Pi fork）→ `retrieve` → 注入（不写历史）| **验收 2 前半**：注入块在本轮、下轮消失 |
| **A5** 对话归档 | `agent_end`→`store(conversation)`；记录注入块；`memory_mark` tool | **验收 2**：第二轮召回第一轮归档块 |
| **A6** 授权（分阶段，**持续迭代**，见 `research-tool-permissions.html`） | **P0**：不给 exec，仅窄工具 + 信任表 + `on_behalf_of`（M1/M2 即可，本身安全）。**P1**：引入 exec 时上每 session 沙箱 + deny>ask>allow + 逃逸带外确认。**P2**：可选 LLM 灰色地带审查员（ADR-018，Experimental）| **验收 6**：陌生人无法触发逃逸工具 |
| **A7** 多渠道 | Discord / Telegram 入站 + send tool | 跨渠道上下文共享 |
| **A8** system prompt | 指导 LLM 用 send tool、归因记忆、填 `on_behalf_of`（ADR 未决 #1）| 多用户混入不串台 |
| **A9** 容错/日志/分发 | 进程级守护、结构化日志、Docker 镜像 + CI（ADR-003）| 容器启动；崩溃自恢复 |

## B 线：记忆补完

| 步 | 交付 | 验证 |
|----|------|------|
| **B0** MemoryProvider 契约 | `memory-contract` 包；默认实现 implements（ADR-015）| mock 插件可替换默认，行为不变（**验收 4**）|
| **B1** 重引入 relations | schema 加回 `relations`；导入串链、归档回填 | 块间形成可遍历图 |
| **B2** 图遍历 | 默认实现 traversal，经注入 ExploreFn 沿 relations 探索（ADR-009d 修订）| 语义不相似但拓扑相连的块能召回 |
| **B3** 动态权重 | 评分 `cosine×boost×decay^marks×recency`（ADR-009c/e）| 常引用块上浮、标记块沉底 |
| **B4** 异质源+调度 | document 监听/导入、external 抓取；scheduler 提炼 ai_insight（ADR-016）| **验收 5**：定时生成 ai_insight 并召回 |
| **B5** 语义去重 | 余弦>0.95 触发 LLM 归并，旧块 `deprecated`+`supersededBy`（ADR-013）| 高相似块归并、旧块可追溯不参与检索 |
| **B6** 插件动态加载 | config 指定 → 动态 import + 校验；最小第三方插件验证 | **验收 4 完整**：改配置切换后端 |
